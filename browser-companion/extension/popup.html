<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OmaKhinsider Queue</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>
        <img src="icons/icon-32.png" width="28" height="28" alt="">
        <span>OmaKhinsider</span>
      </h1>
      <p id="page-status">Checking current page…</p>
      <button id="test-button" type="button">Test plugin connection</button>
      <button id="stage-button" type="button" disabled>Send to Album Queue</button>
      <button id="inspect-button" type="button" disabled>Inspect album for downloads</button>
      <p id="inspection-status" role="status" aria-live="polite"></p>
      <p id="result" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
